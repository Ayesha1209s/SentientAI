{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analyzer</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>
<body>

<div class="container">
    <h2>Feedback Sentiment Analyzer</h2>

    <textarea id="text" placeholder="Enter feedback"></textarea>

    <button onclick="analyze()">Analyze</button>

    <h3 id="result"></h3>
</div>

<script>
function analyze() {
    let text = document.getElementById("text").value;
    let result = document.getElementById("result");
    result.className = "";
    result.innerText = "Analyzing...";


    fetch("/predict/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: "text=" + encodeURIComponent(text)
    })
    .then(response => response.json())
    .then(data => {
    let result = document.getElementById("result");

    result.className = "";  // reset old color

    if (data.sentiment === "Positive") {
        result.classList.add("positive");
    } 
    else if (data.sentiment === "Negative") {
        result.classList.add("negative");
    } 
    else {
        result.classList.add("neutral");
    }

    result.innerText = "Sentiment: " + data.sentiment;
});

}

function getCookie(name) {
    let cookieValue = null;
    const cookies = document.cookie.split(';');
    for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + '=')) {
            cookieValue = cookie.substring(name.length + 1);
        }
    }
    return cookieValue;
}
</script>

</body>
</html>
